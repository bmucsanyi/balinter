[package]
name = "balinter"
version = "0.1.0"
edition = "2021"
description = "Opinionated linter for sprawling research codebases"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.15.18", version = "0.0.0" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.15.18", version = "0.0.0" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.15.18", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.8"
